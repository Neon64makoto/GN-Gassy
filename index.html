<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GN-Neon</title>
  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --panel-alt: #151515;
      --border: #333;
      --border-strong: #444;
      --text: #fff;
      --muted: #b3b3b3;
      --main-color: #0000ff;
      --panel-color: rgba(0, 50, 255, 0.25);
      --music-text: #0000ff;
      --menu-text: #0000ff;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.32);
      --panel-size: 140px;
      --bg-gradient-top: #000000;
      --bg-gradient-bottom: #000000;
      --custom-bg: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-size: 16px;
    }

    body {
      background: var(--custom-bg), linear-gradient(to bottom, var(--bg-gradient-top, #000), var(--bg-gradient-bottom, #000)) no-repeat fixed;
      background-size: cover;
      background-position: center;
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: opacity 0.5s ease;
      min-height: 100vh;
    }

    /* Splash / Loading Overlay */
    #splashOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, #0a0a0a 25%, #1a1a2e 25%, #1a1a2e 50%, #0a0a0a 50%, #0a0a0a 75%, #1a1a2e 75%, #1a1a2e);
      background-size: 40px 40px;
      animation: loading-stripes 0.8s linear infinite;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    #splashOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    #splashText {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px var(--main-color);
      letter-spacing: 4px;
      text-align: center;
      pointer-events: none;
    }

    #splashSubtext {
      margin-top: 1rem;
      color: var(--music-text);
      font-size: 1rem;
      pointer-events: none;
    }

    #performanceModeBtn {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      background: rgba(255, 100, 100, 0.7);
      color: #fff;
      border: 2px solid #ff6464;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    #performanceModeBtn:hover {
      background: rgba(255, 100, 100, 0.9);
      box-shadow: 0 0 15px rgba(255, 100, 100, 0.8);
      transform: scale(1.05);
    }

    @keyframes loading-stripes {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 40px 40px;
      }
    }

    /* Styled scrollbars */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--main-color);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--main-color);
    }

    /* Firefox scrollbar styling */
    * {
      scrollbar-color: var(--main-color) #0a0a0a;
      scrollbar-width: thin;
    }

    body.video-bg {
      position: relative;
    }

    #videoBg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: blur(0px);
    }

    .content-overlay {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.85);
      min-height: 100vh;
    }

    button,
    input, textarea {
      font: inherit;
    }

    button {
      margin: 0.5rem;
      font-size: 1.1rem;
      padding: 1.25rem 2rem;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--main-color);
      color: var(--button-text-color, white);
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease, color 0.2s ease;
    }

    button:hover {
      background: var(--main-color);
      box-shadow: 0 0 15px var(--main-color);
      transform: translateY(-2px);
    }
    
    button.under-construction {
      background: #333;
      border-color: #555;
      color: #888;
      cursor: not-allowed;
      position: relative;
    }
    
    button.under-construction:hover {
      background: #444;
      border-color: #666;
      color: #aaa;
      box-shadow: none;
      transform: none;
    }
    
    button.under-construction:hover span {
      display: none;
    }
    
    button.under-construction:hover::after {
      content: "Under Construction";
    }

    input, textarea {
      margin: 0.5rem;
      font-size: 1.1rem;
      padding: 0.75rem 0.75rem;
      color: var(--text);
      background: #0c0c0c;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
    }

    input::placeholder {
      color: #8b8b8b;
    }

    /* ═══════════════════════════════════════════════════════════
       UNIFIED DIAGONAL PANEL LAYOUT (Opera GX style)
       ═══════════════════════════════════════════════════════════ */

    /* ─── LOGO CONNECTOR (corner piece) ─────────────────────── */
    .logo-connector {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--panel-size);
      height: var(--panel-size);
      z-index: 620; /* Higher than topbar and left-panel */
      background: rgba(17, 17, 17, 0.97);
      border: 2px solid var(--main-color);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--main-color), inset 0 0 15px var(--panel-color);
      transform: translate(-100%, -100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
      opacity: 0;
      font-size: 3rem; 
    }

    .logo-connector.visible {
      transform: translate(0, 0);
      opacity: 1;
    }

    .logo-connector span {
      font-size: 0.55rem;
      font-weight: bold;
      color: var(--main-color);
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--main-color);
      text-align: center;
      line-height: 1.1;
      user-select: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .logo-connector.ui-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-100%, -100%);
    }

    input[type="color"] {
      width: 52px;
      height: 52px;
      padding: 4px;
      border-radius: 10px;
      border: 2px solid var(--main-color);
      background: #111;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 6px;
    }


        /* ─── LEFT PANEL (NAV) ──────────────────────────────────────── */
    .left-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--panel-size);
      height: 100vh;
      z-index: 610;
      background: rgba(17, 17, 17, 0.97);
      border-right: 2px solid var(--main-color);
      border-top: 2px solid var(--main-color);
      backdrop-filter: blur(10px);
      padding-top: var(--panel-size);
      display: flex;
      flex-direction: column;
      gap: 0;
      transform: translateX(calc(-1 * var(--panel-size)));
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
      opacity: 1;
      pointer-events: auto;
    }

    .left-panel.visible {
      transform: translateX(0);
    }

    .left-panel.ui-hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .left-panel.ui-hidden.hover-reveal {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .left-panel .nav {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.5rem;
      width: 100%;
    }

    .left-panel .nav button {
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.8rem;
      font-size: 0.95rem;
      margin: 0;
      background: transparent;
      border: 1px solid var(--panel-color);
      border-radius: 6px;
      color: var(--menu-text);
      transition: all 0.15s;
    }

    .left-panel .nav button:hover {
      background: var(--panel-color);
      border-color: var(--main-color);
      color: #fff;
      transform: translateX(3px);
      box-shadow: 0 0 12px var(--main-color);
    }

      /* ─── TOP PANEL (MUSIC) ──────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--panel-size);
      z-index: 610;
      background: rgba(17, 17, 17, 0.97);
      border-bottom: 2px solid var(--main-color);
      border-left: 2px solid var(--main-color);
      backdrop-filter: blur(10px);
      padding: 0.75rem 0 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-left: var(--panel-size);
      transform: translateY(calc(-1 * var(--panel-size)));
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s;
      opacity: 1;
      pointer-events: auto;
    }

    .topbar.visible {
      transform: translateY(0);
    }

    .topbar.ui-hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .topbar.ui-hidden.hover-reveal {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .topbar-row1 {
      width: 100%;
      display: none;
    }

    .nav {
      text-align: center;
    }

    .topbar-brand {
      display: none;
    }

    .topbar-right {
      position: absolute;
      right: 1.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* ─── DIGITAL CLOCK (7-Segment Style) ─────────────────────────────── */
    #digitalClock {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 630;
      font-family: 'Courier New', Courier, monospace;
      font-size: 3rem;
      font-weight: bold;
      color: var(--main-color);
      text-shadow: 0 0 15px var(--main-color);
      padding: 0.6rem 1.2rem;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--main-color);
      border-radius: 8px;
      text-align: center;
      display: flex;
      align-items: baseline;
      gap: 0.2rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px var(--panel-color);
      transform: translateY(0);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      user-select: none;
    }

    #digitalClock.topbar-active {
      transform: translateY(var(--panel-size));
    }

    #digitalClock.ui-hidden {
      opacity: 0;
    }

    #digitalClock.ui-hidden.viz-persistent {
      opacity: 1;
    }

    .clock-time {
      letter-spacing: 2px;
    }

    .clock-ampm {
      font-size: 1rem;
      margin-left: 0.4rem;
      opacity: 0.8;
    }

    /* ─── HOVER TRIGGER ZONES ─────────────────────────────────────────────── */
    .trigger-zone-left {
      position: fixed;
      top: 0;
      left: 0;
      width: 50px;
      height: 100vh;
      z-index: 500;
    }

    .trigger-zone-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      z-index: 500;
    }

    #muteBtn {
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      min-width: 60px;
    }

    /* ─── STYLIZED VOLUME SLIDER ─────────────────────────────────────── */
    #volumeSlider {
      width: 250px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      outline: none;
      border: 1px solid #333;
      cursor: pointer;
      margin-left: 0.5rem;
    }
    #volumeInput {
      width: 60px;
      padding: 0.2rem 0.4rem;
      margin: 0;
      font-size: 0.9rem;
      text-align: center;
      background: #0c0c0c;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--text);
    }

    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--main-color);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px var(--main-color);
      border: 1px solid #fff;
    }

    #volumeSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--main-color);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px var(--main-color);
      border: 1px solid #fff;
    }

    /* ─── MUSIC CONTROLS ──────────────────────────────────────────────── */
    .music-controls {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      border-top: 1px solid var(--panel-color);
      margin-top: 0.4rem;
    }

    .music-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
    }

    .music-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .music-artist {
      font-size: 0.8rem;
      color: var(--music-text);
    }

    .music-btn-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .music-btn {
      margin: 0;
      padding: 0.35rem 0.65rem;
      font-size: 1rem;
      background: transparent;
      border: 1px solid var(--panel-color);
      border-radius: 6px;
      color: var(--menu-text);
      cursor: pointer;
      transition: all 0.15s;
      min-width: unset;
    }

    .music-btn:hover {
      background: var(--panel-color);
      transform: translateY(-1px);
      border-color: var(--main-color);
      color: #fff;
    }

    .music-btn.active-loop {
      background: var(--panel-color);
      border-color: var(--main-color);
      color: #fff;
    }

    .music-seek-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    .music-time {
      font-size: 0.78rem;
      color: var(--music-text);
      white-space: nowrap;
      min-width: 38px;
      text-align: center;
    }

    #seekBar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, var(--main-color) 0%, #333 0%);
      outline: none;
      cursor: pointer;
      margin: 0;
      padding: 0;
      border: none;
    }

    #seekBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--main-color);
      cursor: pointer;
    }

    /* ─── MAIN CONTENT ────────────────────────────────────────────────── */
    .page-shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 2rem;
      transition: opacity 0.4s;
    }
    .page-shell.wide-shell {
      max-width: 95vw;
    }

    .page-shell.ui-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .site-title {
      margin: 0.5rem 0 1.5rem;
      text-align: center;
      letter-spacing: 0.04em;
      font-size: 3rem;
      color: var(--main-color);
    }

    #content {
      width: 100%;
      min-height: auto;
      padding: 1rem 0 1rem;
    }

    .panel {
      background: linear-gradient(180deg, rgba(0, 0, 0, 1), var(--panel-color));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(5px);
      padding: 10px;
    }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.9fr);
      gap: 1.5rem;
      align-items: stretch;
    }

    .games-panel,
    .web-game-panel {
      background: linear-gradient(180deg, rgba(0, 0, 0, 1), var(--panel-color));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(5px);
      padding: 10px;
      width: 90vw;
      margin-left: calc(50% - 45vw);
    }

    .games-panel h2 {
      padding: 2rem 2rem 1rem 2rem;
      margin: 0;
    }

    .games-menu {
      padding: 0 2rem 2rem 2rem;
      text-align: center;
    }

    #gamesContent {
      width: 100%;
    }

    .hero-panel h2,
    .patch-panel h3,
    .calc-panel h2,
    .games-panel h2,
    .about-panel h2 {
      margin-top: 0;
      font-size: 2rem;
    }

    .lead {
      color: #d2d2d2;
      line-height: 1.6;
      font-size: 1.15rem;
    }

    .image-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .image-card {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.image-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 15px var(--main-color);
}

.image-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}

.image-card span {
  display: block;
  padding: 0.75rem;
  color: var(--muted);
  font-size: 0.95rem;
  text-align: center;
}

    .patch-panel {
      padding: 2rem;
      position: relative;
      overflow: hidden;
      max-height: 600px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .version-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--main-color);
      background: var(--panel-color);
      color: var(--main-color);
      font-size: 0.9rem;
    }

    .patch-list {
      margin: 1rem 0 0;
      padding-left: 1.5rem;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .patch-list li + li {
      margin-top: 0.75rem;
    }

    .section-copy {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .calc-panel,
    .games-panel,
    .about-panel {
      padding: 2rem;
    }

    .calc-panel h2,
    .games-panel h2,
    .about-panel h2 {
      font-size: 2rem;
    }

    .calc-panel h3,
    .games-panel h3,
    .about-panel h3 {
      font-size: 1.5rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    #scratchFrame {
      width: 100%;
      height: 55vh;
      border: none;
      border-radius: 10px;
      background: #000;
    }

    #webGameFrame {
      width: 100%;
      height: 55vh;
      border: none;
      border-radius: 10px;
      background: #000;
    }

    .games-layout {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      padding: 0.5rem 1rem 1rem 1rem;
      margin: 0;
      box-sizing: border-box;
    }

    .games-menu {
      text-align: center;
    }

    .games-menu button {
      display: block;
      width: 40%;
      margin: 0.5rem auto;
      font-size: 1rem;
      padding: 0.75rem 1rem;
    }

    .back-button {
      display: block;
      margin: 0.5rem auto 1rem;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
    }

    .wip-container {
      text-align: center;
      padding: 2rem 1rem;
    }

    .wip-container h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .wip-container p {
      color: #b3b3b3;
      font-size: 1rem;
    }

    .sideBox {
      width: 18%;
      padding: 1rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      overflow-y: auto;
      height: 55vh;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
    }

    .centerBox {
      width: 50%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .sideBox {
      flex-shrink: 0;
    }

    #gameControls,
    #gameNotes {
      white-space: pre-line;
      color: #ddd;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .canvas-wrap {
      position: relative;
      display: inline-block;
    }

    #grid {
      border: 1px solid white;
      background: #000;
    }

    #axesLabels {
      position: absolute;
      font-size: 0.8em;
      color: #ccc;
    }

    #graphResults {
      margin-top: 1rem;
      padding: 1rem;
      background: #0e0e0e;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: left;
      font-size: 1.05rem;
    }

    .version-tag {
      position: fixed;
      bottom: 5px;
      right: 10px;
      color: gray;
      font-size: 0.85rem;
      z-index: 200;

      { title: 'SMRPG Waltz of The Forest', artist: 'Psyguy' }
    ];

    // ─── CLOCK LOGIC ─────────────────────────────────────────────────────────────
    let clockSettings = { showSeconds: true, is24h: false, size: 3, color: '#0000ff' };
    
    function updateClock() {
      const now = new Date();
      let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      const ampm = h >= 12 ? 'PM' : 'AM';
      if (!clockSettings.is24h) { h = h % 12 || 12; }
      
      let timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
      if (clockSettings.showSeconds) { timeStr += `:${s.toString().padStart(2, '0')}`; }
      
      document.getElementById('clockTime').innerText = timeStr;
      document.getElementById('clockAmPm').innerText = clockSettings.is24h ? '' : ampm;
      document.getElementById('clockAmPm').style.display = clockSettings.is24h ? 'none' : 'block';
    }
    setInterval(updateClock, 1000);

    function updateClockSettings() {
      const showSec = document.getElementById('clockShowSeconds');
      const is24 = document.getElementById('clock24h');
      const size = document.getElementById('clockSize');
      const color = document.getElementById('clockColor');
      
      if (showSec) clockSettings.showSeconds = showSec.checked;
      if (is24) clockSettings.is24h = is24.checked;
      if (size) {
        clockSettings.size = size.value;
        document.getElementById('digitalClock').style.fontSize = `${size.value}rem`;
      }
      if (color) {
        clockSettings.color = color.value;
        document.getElementById('digitalClock').style.color = color.value;
        document.getElementById('digitalClock').style.textShadow = `0 0 15px ${color.value}`;
        document.getElementById('digitalClock').style.borderColor = color.value;
      }
      localStorage.setItem('gn_neon_clock', JSON.stringify(clockSettings));
      updateClock();
    }

    // ─── PLAYLIST LOGIC ──────────────────────────────────────────────────────────
    function togglePlaylist() {
      isPlaylistOpen = !isPlaylistOpen;
      const panel = document.getElementById('playlistPanel');
      panel.classList.toggle('visible', isPlaylistOpen);
      if (isPlaylistOpen) renderPlaylist();
    }

    function renderPlaylist() {
      const grid = document.getElementById('playlistGrid');
      grid.innerHTML = trackMeta.map((track, i) => `
        <div class="playlist-item ${currentTrack === i ? 'active' : ''}" onclick="playTrack(${i})">
          <div class="title">${track.title}</div>
          <div class="artist">${track.artist}</div>
        </div>
      `).join('');
    }

    function playTrack(i) {
      currentTrack = i;
      const a = document.getElementById('bgMusic');
      a.src = playlist[currentTrack];
      updateTrackDisplay();
      a.play();
      if (isPlaylistOpen) renderPlaylist();
    }

    // ─── CANVAS ENHANCEMENTS ─────────────────────────────────────────────────────
    let isDrawing = false, lastX = 0, lastY = 0;
    function initCanvas() {
      const canvas = document.getElementById('paintingCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.addEventListener('mousedown', (e) => { isDrawing = true; [lastX, lastY] = [e.offsetX, e.offsetY]; });
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mouseout', () => isDrawing = false);
    }

    function draw(e) {
      if (!isDrawing) return;
      const canvas = document.getElementById('paintingCanvas');
      const ctx = canvas.getContext('2d');
      const color = document.getElementById('brushColor').value;
      const size = document.getElementById('brushSize').value;
      const shape = document.getElementById('brushShape').value;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = shape === 'round' ? 'round' : 'square';
      ctx.lineJoin = shape === 'round' ? 'round' : 'miter';

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      [lastX, lastY] = [e.offsetX, e.offsetY];
    }

    function setEraser() { document.getElementById('brushColor').value = '#ffffff'; }
    function clearCanvas() { 
      const canvas = document.getElementById('paintingCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    function downloadCanvas() {
      const canvas = document.getElementById('paintingCanvas');
      const link = document.createElement('a');
      link.download = 'neon-art.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    // ─── DICTIONARY LOGIC ────────────────────────────────────────────────────────
    async function searchDict() {
      const word = document.getElementById('dictInput').value;
      const results = document.getElementById('dictResults');
      if (!word) return;
      
      results.style.display = 'block';
      results.innerHTML = 'Searching...';
      
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        const data = await response.json();
        
        if (data.title === "No Definitions Found") {
          results.innerHTML = 'No results found.';
          return;
        }

        results.innerHTML = data[0].meanings.map(m => `
          <div class="dict-entry">
            <div class="dict-pos">${m.partOfSpeech}</div>
            <ul style="padding-left:1.5rem;">
              ${m.definitions.slice(0, 3).map(d => `<li>${d.definition}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      } catch (e) {
        results.innerHTML = 'Error fetching definition.';
      }
    }

    // ─── CIPHER LOGIC ────────────────────────────────────────────────────────────
    function runCaesar() {
      const text = document.getElementById('caesarInput').value;
      const shift = parseInt(document.getElementById('caesarShift').value);
      document.getElementById('caesarOutput').innerText = text.replace(/[a-z]/gi, (c) => {
        const start = c <= 'Z' ? 65 : 97;
        return String.fromCharCode(((c.charCodeAt(0) - start + shift) % 26 + 26) % 26 + start);
      });
    }

    function runAtbash() {
      const text = document.getElementById('atbashInput').value;
      const abc = "abcdefghijklmnopqrstuvwxyz";
      const zyx = "zyxwvutsrqponmlkjihgfedcba";
      document.getElementById('atbashOutput').innerText = text.replace(/[a-z]/gi, (c) => {
        const isUpper = c === c.toUpperCase();
        const idx = abc.indexOf(c.toLowerCase());
        if (idx === -1) return c;
        const res = zyx[idx];
        return isUpper ? res.toUpperCase() : res;
      });
    }

    // ─── BACKGROUND LOGIC ────────────────────────────────────────────────────────
    function applyCustomBg() {
      const url = document.getElementById('customBgUrl').value;
      if (!url) return;
      document.documentElement.style.setProperty('--custom-bg', `url('${url}')`);
      localStorage.setItem('gn_neon_custom_bg', url);
    }
    function clearCustomBg() {
      document.documentElement.style.setProperty('--custom-bg', 'none');
      localStorage.removeItem('gn_neon_custom_bg');
    }

    // ─── CORE LOGIC ──────────────────────────────────────────────────────────────
    function load(page) {
      const main = document.getElementById('mainContent');
      if (page !== 'home' && page !== 'games') { main.classList.add('wide-shell'); } 
      else { main.classList.remove('wide-shell'); }
      document.getElementById("content").innerHTML = pages[page];
      
      // Initialize components after load
      if (page === 'settings') {
        const savedClock = localStorage.getItem('gn_neon_clock');
        if (savedClock) {
          clockSettings = JSON.parse(savedClock);
          document.getElementById('clockShowSeconds').checked = clockSettings.showSeconds;
          document.getElementById('clock24h').checked = clockSettings.is24h;
          document.getElementById('clockSize').value = clockSettings.size;
          document.getElementById('clockColor').value = clockSettings.color;
          updateClockSettings();
        }
        const savedBg = localStorage.getItem('gn_neon_custom_bg');
        if (savedBg) document.getElementById('customBgUrl').value = savedBg;
      }
      
      const navButtons = document.querySelectorAll('.left-panel .nav button');
      navButtons.forEach(btn => {
        btn.style.background = 'transparent';
        btn.style.color = 'var(--menu-text)';
      });
      const pageIdx = { 'home':0, 'tools':1, 'games':2, 'creations':3, 'about':4, 'settings':5 }[page];
      if (navButtons[pageIdx]) {
        navButtons[pageIdx].style.background = 'var(--main-color)';
        navButtons[pageIdx].style.color = '#fff';
      }
    }

    function revealUI(side) {
      if (side === 'left') document.getElementById('leftPanel').classList.add('visible');
      if (side === 'top') document.getElementById('topbar').classList.add('visible');
    }

    // Close UI on click outside
    window.onclick = (e) => {
      if (!e.target.closest('.left-panel') && !e.target.closest('.trigger-zone-left')) 
        document.getElementById('leftPanel').classList.remove('visible');
      if (!e.target.closest('.topbar') && !e.target.closest('.trigger-zone-top') && !e.target.closest('#playlistPanel')) 
        document.getElementById('topbar').classList.remove('visible');
    };

    // Initialize
    window.onload = () => {
      load('home');
      updateClock();
      const savedBg = localStorage.getItem('gn_neon_custom_bg');
      if (savedBg) document.documentElement.style.setProperty('--custom-bg', `url('${savedBg}')`);
    };

    // Reuse existing music functions with small tweaks
    function updateTrackDisplay() {
      const meta = trackMeta[currentTrack];
      document.getElementById('mcTitle').innerText = meta.title;
      document.getElementById('mcArtist').innerText = meta.artist;
      document.getElementById('mcPlayPause').innerText = '▮▮';
    }
    function musicPlayPause() {
      const a = document.getElementById('bgMusic');
      if (a.paused) { a.play(); document.getElementById('mcPlayPause').innerText = '▮▮'; }
      else { a.pause(); document.getElementById('mcPlayPause').innerText = '▶'; }
    }
    function musicNext() { currentTrack = (currentTrack + 1) % playlist.length; playTrack(currentTrack); }
    function musicPrev() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; playTrack(currentTrack); }
    function musicToggleLoop() { isLooping = !isLooping; document.getElementById('mcLoop').classList.toggle('active-loop', isLooping); }
    function setVolume(v) { document.getElementById('bgMusic').volume = v/100; document.getElementById('volumeInput').value = v; }
    function toggleMute() { const a = document.getElementById('bgMusic'); a.muted = !a.muted; document.getElementById('muteBtn').innerText = a.muted ? 'Unmute' : 'Mute'; }
    function musicSeek(v) { const a = document.getElementById('bgMusic'); a.currentTime = (v/100) * a.duration; }
    document.getElementById('bgMusic').ontimeupdate = () => {
      const a = document.getElementById('bgMusic');
      const seek = document.getElementById('seekBar');
      seek.value = (a.currentTime / a.duration) * 100;
      document.getElementById('mcCurrent').innerText = fmtTime(a.currentTime);
      document.getElementById('mcDuration').innerText = fmtTime(a.duration);
    };
    function fmtTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }
    
    // Auto-enter
    document.getElementById('splashOverlay').onclick = () => {
      document.getElementById('splashOverlay').classList.add('fade-out');
      document.getElementById('bgMusic').src = playlist[currentTrack];
      updateTrackDisplay();
    };

  </script>
</body>
